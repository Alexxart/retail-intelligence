</style><header><h1>RETAIL INTELLIGENCE</h1><p>Александр Артёмов | Data Analyst</p><p style="font-size:12px">CAREER DISCOVERY / 2024–2025 / Синтетические данные · Hoff — отраслевой референс</p></header><main><nav id="tabs"></nav><div class="filters" id="filters"></div><div id="content"></div><footer>Валовая прибыль не включает логистику. Возвраты отнесены к исходной продаже. Все показатели моделируемой сети.</footer></main><script>
const packed=/*DATA*/;const unpack=x=>x.rows.map(r=>Object.fromEntries(x.columns.map((c,i)=>[c,r[i]])));const S=unpack(packed.sales),I=unpack(packed.stock),L=unpack(packed.logistics),A=unpack(packed.abc),B=unpack(packed.bridge),C=unpack(packed.cohort);const months=[...new Set(S.map(x=>x.month))].sort(), uniq=(a,k)=>[...new Set(a.map(x=>x[k]))].sort();let tab=0;const names=['Executive Overview','Category Performance','Customer Analytics','Inventory & Operations'];const fmt=(x,d=1)=>Number.isFinite(x)?x.toLocaleString('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:d}):'—',money=x=>fmt(x/1e6)+' млн ₽',pct=x=>fmt(x*100,2)+'%',sum=(a,k)=>a.reduce((s,x)=>s+x[k],0),group=(a,k)=>{let m=new Map;for(let x of a){let v=x[k];if(!m.has(v))m.set(v,[]);m.get(v).push(x)}return [...m].sort((a,b)=>String(a[0]).localeCompare(String(b[0])))};const ratio=(a,b)=>b?a/b:NaN;function stats(a){let net=sum(a,'net'),profit=sum(a,'profit'),orders=new Set(a.map(x=>x.order_id)).size;return {net,profit,orders,margin:ratio(profit,net),aov:ratio(net,orders),returns:ratio(sum(a,'returned'),sum(a,'quantity')),cogs:sum(a,'cogs')}}
const el=id=>document.getElementById(id);el('tabs').innerHTML=names.map((n,i)=>`<button onclick="tab=${i};render()">${n}</button>`).join('');function select(id,label,opts,def){return `<label>${label}<select id="${id}" onchange="render()">${opts.map(x=>`<option value="${x}" ${x===def?'selected':''}>${x||'Все'}</option>`).join('')}</select></label>`}el('filters').innerHTML=select('from','С месяца',months,months[0])+select('to','По месяц',months,months.at(-1))+select('region','Регион продаж',['',...uniq(S,'region')],'')+select('channel','Канал',['',...uniq(S,'channel')],'')+select('category','Категория',['',...uniq(S,'category')],'')+'<button onclick="reset()">Сбросить</button>';function reset(){el('from').value=months[0];el('to').value=months.at(-1);for(let k of ['region','channel','category'])el(k).value='';render()}
const panel=(t,b,n='',wide=false)=>`<section class="panel ${wide?'wide':''}"><h3>${t}</h3>${b}<p class="note">${n}</p></section>`,kpi=(t,v,n='')=>`<div class="kpi"><small>${t}</small><b>${v}</b><small>${n}</small></div>`,table=(h,r)=>r.length?`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Нет данных</div>';
function bars(rows,unit='',color='#14243D'){if(!rows.length)return '<div class="empty">Нет данных</div>';let max=Math.max(1,...rows.map(x=>Math.abs(x[1]))),h=rows.length*29+12;return `<svg viewBox="0 0 600 ${h}" role="img">${rows.map(([n,v],i)=>`<text x="0" y="${i*29+19}" font-size="11" fill="#64748b">${n}</text><rect x="135" y="${i*29+5}" width="${Math.abs(v)/max*350}" height="17" fill="${v<0?'#a65353':color}"><title>${n}: ${fmt(v,2)} ${unit}</title></rect><text x="495" y="${i*29+18}" font-size="11">${fmt(v,2)} ${unit}</text>`).join('')}</svg>`}
function trend(rows){if(!rows.length)return '<div class="empty">Нет данных</div>';let max=Math.max(1,...rows.flatMap(x=>[x[1],x[2]])),w=620,h=230,xx=i=>45+i*550/Math.max(1,rows.length-1),yy=v=>185-v/max*150;return `<svg viewBox="0 0 ${w} ${h}">${[0,.25,.5,.75,1].map(t=>`<line x1="45" x2="595" y1="${yy(max*t)}" y2="${yy(max*t)}" stroke="#e2e8f0"/><text x="0" y="${yy(max*t)+4}" font-size="10">${fmt(max*t,0)}</text>`).join('')}${[1,2].map((k,j)=>`<polyline fill="none" stroke="${j?'#bba17a':'#14243d'}" stroke-width="2.5" points="${rows.map((r,i)=>`${xx(i)},${yy(r[k])}`).join(' ')}"/>${rows.map((r,i)=>`<circle cx="${xx(i)}" cy="${yy(r[k])}" r="3" fill="${j?'#bba17a':'#14243d'}"><title>${r[0]}: ${fmt(r[k],2)}</title></circle>`).join('')}`).join('')}${rows.map((r,i)=>i%Math.max(1,Math.ceil(rows.length/8))===0?`<text x="${xx(i)}" y="205" font-size="10" text-anchor="middle">${r[0]}</text>`:'').join('')}</svg>`}
function waterfall(){let a=stats(S.filter(x=>x.month.startsWith('2024'))).profit/1e6,z=stats(S.filter(x=>x.month.startsWith('2025'))).profit/1e6,run=a;let r=[['2024',0,a]];for(let x of B){let next=run+x.effect/1e6;r.push([x.factor,run,next]);run=next}r.push(['2025',0,z]);let max=Math.max(...r.flatMap(x=>x.slice(1)))*1.12;return `<svg viewBox="0 0 850 250">${r.map(([n,a,b],i)=>{let x=15+i*93,y=190-Math.max(a,b)/max*170;return `<rect x="${x}" y="${y}" width="65" height="${Math.max(.5,Math.abs(b-a)/max*170)}" fill="${i===0||i===r.length-1?'#14243d':b>a?'#bba17a':'#a65353'}"><title>${n}: ${fmt(b-a,3)} млн ₽</title></rect><text x="${x+32}" y="${y-6}" text-anchor="middle" font-size="11">${fmt(b-a)}</text><text x="${x+32}" y="207" text-anchor="middle" font-size="9">${n}</text>`}).join('')}</svg>`}
function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===tab));let from=el('from').value,to=el('to').value,region=el('region').value,channel=el('channel').value,cat=el('category').value;let period=x=>x.month>=from&&x.month<=to,scope=x=>(!region||x.region===region)&&(!channel||x.channel===channel)&&(!cat||x.category===cat),f=S.filter(x=>period(x)&&scope(x)),s=stats(f),m=group(f,'month'),g=group(f,'category');let out=`<h2>${names[tab]}</h2><p class="note">${from} — ${to} · ${region||'Все регионы'} · ${channel||'Все каналы'} · ${cat||'Все категории'}</p>`;if(from>to){el('content').innerHTML=out+'<div class="empty">Начало периода позже окончания.</div>';return}if(!f.length)out+='<div class="empty">Нет продаж в выбранной выборке. Независимые показатели могут оставаться доступными.</div>';
if(tab===0){out+='<div class="kpis">'+kpi('Чистая выручка',money(s.net))+kpi('Валовая прибыль',money(s.profit))+kpi('Маржа',pct(s.margin))+kpi('Заказы',fmt(s.orders,0))+kpi('Средний чек',fmt(s.aov,0)+' ₽')+'</div><div class="grid">'+panel('Финансовая динамика · млн ₽',trend(m.map(([k,a])=>[k,sum(a,'net')/1e6,sum(a,'profit')/1e6])),'Тёмно-синий — выручка; золото — прибыль.')+panel('Маржинальность · %',trend(m.map(([k,a])=>[k,stats(a).margin*100,stats(a).margin*100])),'Отношение сумм, не среднее процентов.')+panel('Сравнение календарных лет',table(['Год','Выручка','Прибыль','Маржа','Заказы'],[2024,2025].map(y=>{let a=stats(f.filter(x=>x.month.startsWith(y)));return [y,money(a.net),money(a.profit),pct(a.margin),fmt(a.orders,0)]})),'В пределах выбранных месяцев; неполные годы не являются сопоставимым YoY.')+panel('Факторный мост · млн ₽',waterfall(),'Фиксированный полный периметр 2024–2025. Фильтры не применяются.',true)+'</div>'}
if(tab===1){out+='<div class="kpis">'+kpi('Выручка',money(s.net))+kpi('COGS',money(s.cogs))+kpi('Возвраты',pct(s.returns))+kpi('Маржа',pct(s.margin))+'</div><div class="grid">'+panel('Прибыль по категориям · млн ₽',bars(g.map(([k,a])=>[k,sum(a,'profit')/1e6])))+panel('Возвраты по категориям · %',bars(g.map(([k,a])=>[k,stats(a).returns*100]),'%','#bba17a'))+panel('Скидки и экономика',table(['Скидка','Выручка','COGS','Прибыль','Маржа'],group(f,'discount').map(([k,a])=>{let t=stats(a);return [pct(k),money(t.net),money(t.cogs),money(t.profit),pct(t.margin)]})))+panel('Категории',table(['Категория','Выручка','Прибыль','Маржа'],g.map(([k,a])=>{let t=stats(a);return [k,money(t.net),money(t.profit),pct(t.margin)]})))+panel('SKU · рейтинг по выручке',table(['SKU','Выручка','COGS','Прибыль','Маржа','Возвраты'],group(f,'product_id').map(([k,a])=>[k,stats(a)]).sort((a,b)=>b[1].net-a[1].net).map(([k,t])=>[k,money(t.net),money(t.cogs),money(t.profit),pct(t.margin),pct(t.returns)])),'Все SKU выбранной выборки.',true)+'</div>'}
if(tab===2){let customers=group(f,'customer_id'),repeat=customers.filter(([k,a])=>stats(a).orders>1).length;let seg={active_repeat:[],one_time:[],other:[]};let cutoff=new Date(to+'-01');cutoff.setMonth(cutoff.getMonth()+1);for(let [k,a] of customers){let n=stats(a).orders,last=a.reduce((v,x)=>x.day>v?x.day:v,'');seg[n===1?'one_time':n>=4&&(cutoff-new Date(last))/86400000<=90?'active_repeat':'other'].push(...a)}out+='<div class="kpis">'+kpi('Покупатели',fmt(customers.length,0))+kpi('Повторные покупатели',pct(ratio(repeat,customers.length)))+kpi('Выручка на клиента',fmt(ratio(s.net,customers.length),0)+' ₽')+'</div><div class="grid">'+panel('Клиентские сегменты',table(['Сегмент','Клиенты','Выручка'],Object.entries(seg).map(([k,a])=>[({active_repeat:'Активные постоянные',one_time:'Разовые',other:'Прочие'})[k],fmt(new Set(a.map(x=>x.customer_id)).size,0),money(sum(a,'net'))])),'Сегменты внутри выборки; ≥4 заказа и давность ≤90 дней до конца периода.')+panel('Активные покупатели по месяцам',trend(m.map(([k,a])=>[k,new Set(a.map(x=>x.customer_id)).size,new Set(a.map(x=>x.customer_id)).size])))+panel('Когортное удержание · полный периметр',cohort(),'Первая наблюдаемая покупка; фильтры не применяются. Будущие месяцы пустые.',true)+'</div>'}
if(tab===3){let i=I.filter(x=>period(x)&&(!cat||x.category===cat)),sf=S.filter(x=>period(x)&&(!cat||x.category===cat)),days=months.filter(x=>x>=from&&x<=to).reduce((a,x)=>a+new Date(+x.slice(0,4),+x.slice(5),0).getDate(),0),avg=ratio(sum(i,'value_days'),days),turn=ratio(sum(sf,'cogs'),avg),log=L.filter(x=>period(x)&&(!region||x.region===region)&&(!channel||x.channel===channel));out+='<p class="note">Склад: период и категория; регион продаж и канал не применяются. Логистика: период, регион продаж и канал; категория не применяется.</p><div class="kpis">'+kpi('Средний запас',money(avg))+kpi('Оборачиваемость за период',fmt(turn,2))+kpi('DIO',fmt(ratio(days,turn),2)+' дн.')+kpi('GMROI за период',fmt(ratio(sum(sf,'profit'),avg),3))+kpi('Дни дефицита',pct(ratio(sum(i,'stockout_days'),sum(i,'days'))))+kpi('Неудовлетворённый спрос',fmt(sum(i,'unmet_demand'),0)+' ед.')+'</div><div class="grid">'+panel('Стоимость конечных запасов · млн ₽',trend(group(i,'month').map(([k,a])=>[k,sum(a,'value')/1e6,sum(a,'value')/1e6])))+panel('Дефицит по категориям · %',bars(group(i,'category').map(([k,a])=>[k,ratio(sum(a,'stockout_days'),sum(a,'days'))*100]),'%'))+panel('ABC / XYZ · полные календарные годы',table(['Год / ABC','X','Y','Z'],[2024,2025].flatMap(y=>['A','B','C'].map(a=>[`${y} / ${a}`,...['X','Y','Z'].map(z=>A.filter(x=>x.year===y&&x.abc===a&&x.xyz===z&&(!cat||x.category===cat)).length)]))),'Классы рассчитаны по сети за полный год; категория только ограничивает показ SKU. Период, регион и канал не меняют классификацию.')+panel('Логистика',table(['Канал','Расходы','На заказ','Опоздания'],group(log,'channel').map(([k,a])=>[k,money(sum(a,'delivery_cost')),fmt(ratio(sum(a,'delivery_cost'),sum(a,'n')),0)+' ₽',pct(ratio(sum(a,'late'),sum(a,'n')))])))+'</div>'}el('content').innerHTML=out;window.current={s,tab,rows:f.length};}
function cohort(){let cohorts=uniq(C,'cohort'),map=new Map(C.map(x=>[x.cohort+'|'+x.month,x.retention]));return table(['Когорта',...Array.from({length:24},(_,i)=>'M'+i)],cohorts.map(c=>[c,...Array.from({length:24},(_,j)=>{let d=new Date(c+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+j);let m=d.toISOString().slice(0,7),v=map.get(c+'|'+m);return m>months.at(-1)?'—':`<span title="${c} / ${m}" style="display:block;background:rgba(20,36,61,${(v||0)*.75});color:${v>.55?'white':'#14243d'}">${fmt((v||0)*100,0)}%</span>`})]))}render();
